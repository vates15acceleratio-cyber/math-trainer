        /* ===================== RENDU MATH (fractions \frac{a}{b}) ===================== */
        function parseMath(str) {
            const parts = [];
            let i = 0;
            while (i < str.length) {
                const idx = str.indexOf('\\frac{', i);
                if (idx === -1) { parts.push(str.slice(i)); break; }
                if (idx > i) parts.push(str.slice(i, idx));
                let j = idx + 6, depth = 1, num = '';
                while (j < str.length && depth > 0) {
                    if (str[j] === '{') depth++;
                    else if (str[j] === '}') { depth--; if (depth === 0) break; }
                    num += str[j]; j++;
                }
                j++; let den = '';
                if (str[j] === '{') {
                    j++; depth = 1;
                    while (j < str.length && depth > 0) {
                        if (str[j] === '{') depth++;
                        else if (str[j] === '}') { depth--; if (depth === 0) break; }
                        den += str[j]; j++;
                    }
                    j++;
                }
                parts.push({ num, den });
                i = j;
            }
            return parts;
        }
        const MathText = ({ children, className }) => {
            const parts = parseMath(children || '');
            return (
                <span className={className}>
                    {parts.map((p, k) => typeof p === 'string'

                        : <span key={k} className="frac"><span className="num">{p.num}</span><span className="den">{p.den}</span></span>
                    )}
                </span>
            );
        };

            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

                const ops = ['+', '−', '×', '÷', '%'];
                const operation = ops[Math.floor(Math.random() * ops.length)];
                let a, b, label, correct;

                if (operation === '+' || operation === '−') {
                    const maxNum = Math.min(10 ** Math.min(level, 4), 9999);
                    a = rnd(0, maxNum); b = rnd(0, maxNum);
                    if (operation === '−' && b > a) [a, b] = [b, a];
                    correct = operation === '+' ? a + b : a - b;
                    label = `${a} ${operation} ${b}`;
                } else if (operation === '×') {
                    const hi = level <= 1 ? 5 : level <= 3 ? 9 : 10;
                    a = rnd(2, hi); b = rnd(2, hi);
                    correct = a * b; label = `${a} × ${b}`;
                } else if (operation === '÷') {
                    const hi = level <= 1 ? 5 : level <= 3 ? 9 : 10;
                    b = rnd(2, hi); const q = rnd(2, hi); a = b * q;

            return (
                <div onClick={() => setFlipped(f => !f)}
                    className={`rounded-2xl p-4 cursor-pointer transition border min-h-[8rem] flex flex-col ${flipped ? 'bg-sky-950/40 border-sky-800' : 'bg-slate-800 border-slate-700'}`}>
                    {!flipped && hasShape && <Schema shape={item.shape} />}
                    <div className={`text-[9px] uppercase tracking-widest mb-1.5 font-semibold ${flipped ? 'text-sky-400' : 'text-slate-500'}`}>{flipped ? 'Réponse' : 'Question'}</div>
                    <div className="flex-1 flex items-center">
                        <div className="text-white font-medium leading-relaxed text-[15px]" style={{ whiteSpace: 'pre-line' }}>
                            {flipped
                                ? item.a.split('\n').map((line, i) => <div key={i} className={i > 0 ? 'mt-1.5' : ''}><MathText>{line}</MathText></div>)
                                : <MathText>{item.q}</MathText>}
                        </div>
                    </div>
                </div>
            );
        };
        const FlashcardsApp = ({ onBack }) => {
            const [category, setCategory] = useState(null);
            if (!category) {
                const groups = {};
                Object.entries(CATEGORIES).forEach(([k, v]) => { (groups[v.group] = groups[v.group] || []).push(k); });
                return (
                    <div className="min-h-screen p-5 fade-in">
                        <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                        <h2 className="text-2xl font-bold text-white mb-1">Flashcards</h2>
                        <p className="text-slate-400 text-sm mb-6">Choisis une catégorie · touche une carte pour la retourner</p>
                        <div className="max-w-2xl space-y-6">
                            {Object.entries(groups).map(([g, keys]) => (
                                <div key={g}>
                                    <h3 className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2 px-1">{g}</h3>
                                    <div className="grid gap-2">
                                        {keys.map(k => (
                                            <button key={k} onClick={() => setCategory(k)} className="p-4 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-left transition flex justify-between items-center border border-slate-700/50">
                                                <span className="font-medium">{CATEGORIES[k].label}</span>
                                                <span className="text-xs text-slate-500">{FORMULAS[k].length}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
            const cards = FORMULAS[category];
            return (
                <div className="min-h-screen p-5 fade-in">
                    <div className="flex items-center justify-between mb-5 max-w-3xl mx-auto">
                        <button onClick={() => setCategory(null)} className="text-slate-400 hover:text-white">← Catégories</button>
                        <span className="font-medium text-slate-300">{CATEGORIES[category].label}</span>
                    </div>
                    <div className="max-w-3xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        {cards.map((item, i) => <Card key={i} item={item} />)}
                    </div>
                    <p className="text-slate-600 text-xs text-center mt-5 max-w-3xl mx-auto">Toutes les cartes sont affichées. Touche une carte pour révéler la réponse.</p>
                </div>
            );
        };

        /* ===================== CONVERTISSEUR ===================== */
        const Converter = ({ onBack }) => {
            const cats = Object.keys(CONVERSIONS);
            const [cat, setCat] = useState(cats[0]);
            const [value, setValue] = useState('1');
            const units = Object.keys(CONVERSIONS[cat]);
            const [from, setFrom] = useState(units[0]);
            const isTemp = cat === 'Température';
            const changeCat = (c) => { setCat(c); setFrom(Object.keys(CONVERSIONS[c])[0]); };
            const v = parseFloat(value.replace(',', '.'));
            const valid = !isNaN(v);
            const fmt = (x) => { if (x === 0) return '0'; const abs = Math.abs(x); if (abs < 1e-4 || abs >= 1e7) return x.toExponential(4).replace('.', ','); return parseFloat(x.toPrecision(7)).toString().replace('.', ','); };
            const convert = (u) => {
                if (!valid) return '—';
                if (isTemp) return fmt(fromC(toC(v, from), u));
                return fmt((v * CONVERSIONS[cat][from]) / CONVERSIONS[cat][u]);
            };
            return (
                <div className="min-h-screen p-5 fade-in">
                    <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                    <div className="max-w-2xl mx-auto">
                        <h2 className="text-2xl font-bold text-white mb-5">Convertisseur d'unités</h2>
                        <div className="flex gap-2 overflow-x-auto pb-2 mb-5 -mx-1 px-1">
                            {cats.map(c => (<button key={c} onClick={() => changeCat(c)} className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap transition ${cat === c ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>{c.split(' (')[0]}</button>))}
                        </div>
                        <div className="bg-slate-800 rounded-2xl p-4 mb-4 border border-slate-700">
                            <input type="text" inputMode="decimal" value={value} onChange={e => setValue(e.target.value)} className="w-full bg-transparent text-3xl text-white focus:outline-none mb-3" />
                            <div className="flex flex-wrap gap-2">
                                {units.map(u => (<button key={u} onClick={() => setFrom(u)} className={`px-3 py-1 rounded-lg text-sm transition ${from === u ? 'bg-sky-600 text-white' : 'bg-slate-700 text-slate-300'}`}>{u}</button>))}
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            {units.filter(u => u !== from).map(u => (
                                <div key={u} className="flex justify-between items-center bg-slate-800/50 rounded-xl px-4 py-3 border border-slate-700/40">
                                    <span className="text-slate-400 text-sm">{u}</span>
                                    <span className="text-white font-mono">{convert(u)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        /* ===================== RÉFÉRENCE ===================== */
        const Reference = ({ onBack }) => {
            const [tab, setTab] = useState('constants');
            return (
                <div className="min-h-screen p-5 fade-in">
                    <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                    <div className="max-w-2xl mx-auto">
                        <h2 className="text-2xl font-bold text-white mb-4">Référence</h2>
                        <div className="flex gap-2 mb-5">
                            <button onClick={() => setTab('constants')} className={`px-4 py-2 rounded-xl text-sm transition ${tab === 'constants' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Constantes physiques</button>
                            <button onClick={() => setTab('materials')} className={`px-4 py-2 rounded-xl text-sm transition ${tab === 'materials' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Matériaux</button>
                        </div>
                        {tab === 'constants' && (
                            <div className="space-y-1.5">
                                {CONSTANTS.map((c, i) => (
                                    <div key={i} className="flex items-center justify-between bg-slate-800/50 rounded-xl px-4 py-3 border border-slate-700/40">
                                        <div><span className="text-sky-400 font-mono font-semibold mr-2">{c.sym}</span><span className="text-slate-400 text-sm">{c.name}</span></div>
                                        <span className="text-white font-mono text-sm text-right">{c.val}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                        {tab === 'materials' && (
                            <div>
                                <div className="overflow-x-auto rounded-xl border border-slate-700/40">
                                    <table className="w-full text-sm">
                                        <thead><tr className="bg-slate-800 text-slate-400"><th className="text-left px-3 py-2.5 font-medium">Matériau</th><th className="px-3 py-2.5 font-medium">E (GPa)</th><th className="px-3 py-2.5 font-medium">ρ (kg/m³)</th><th className="px-3 py-2.5 font-medium">λ (W/m·K)</th><th className="px-3 py-2.5 font-medium">ν</th></tr></thead>
                                        <tbody>
                                            {MATERIALS.map((m, i) => (
                                                <tr key={i} className={i % 2 ? 'bg-slate-800/30' : 'bg-slate-800/60'}>
                                                    <td className="text-left px-3 py-2.5 text-white font-medium">{m.mat}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.E}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.rho}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.lambda}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.nu}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <p className="text-slate-500 text-xs mt-3 px-1">Valeurs indicatives de cours. Pour le dimensionnement réglementaire, se référer aux normes (Eurocodes, DTU) et à la nuance exacte.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* ===================== ACCUEIL + APP ===================== */
        const Home = ({ go }) => {
            const tiles = [
                { id: 'mental', label: 'Calcul mental', sub: 'Adaptatif + aide', icon: <IconBrain />, color: 'from-sky-600 to-sky-700' },
                { id: 'flashcards', label: 'Flashcards', sub: '18 catégories', icon: <IconBook />, color: 'from-indigo-600 to-indigo-700' },
                { id: 'converter', label: 'Convertisseur', sub: '12 familles d\'unités', icon: <IconConvert />, color: 'from-teal-600 to-teal-700' },
                { id: 'reference', label: 'Référence', sub: 'Constantes & matériaux', icon: <IconAtom />, color: 'from-violet-600 to-violet-700' },
            ];
            return (
                <div className="min-h-screen p-5 flex flex-col justify-center fade-in">
                    <div className="max-w-md mx-auto w-full">
                        <div className="mb-10"><h1 className="text-3xl font-bold text-white tracking-tight">Math &amp; Physique</h1><p className="text-slate-400 mt-1">Entraînement et aide-mémoire — sciences de l'ingénieur</p></div>
                        <div className="grid grid-cols-2 gap-3">
                            {tiles.map(t => (
                                <button key={t.id} onClick={() => go(t.id)} className={`aspect-square p-4 bg-gradient-to-br ${t.color} text-white rounded-2xl transition active:scale-95 flex flex-col justify-between text-left`}>
                                    <div className="opacity-90">{t.icon}</div>
                                    <div><div className="font-bold leading-tight">{t.label}</div><div className="text-xs opacity-75 mt-0.5">{t.sub}</div></div>
                                </button>
                            ))}
                        </div>
                        <p className="text-slate-600 text-xs text-center mt-8">Hors ligne • aucune donnée collectée</p>
                    </div>
                </div>
            );
        };
        const App = () => {
            const [view, setView] = useState('home');
            const back = () => setView('home');
            return (
                <div className="text-white">
                    {view === 'home' && <Home go={setView} />}
                    {view === 'mental' && <MentalMathGame onBack={back} />}
                    {view === 'flashcards' && <FlashcardsApp onBack={back} />}
                    {view === 'converter' && <Converter onBack={back} />}
                    {view === 'reference' && <Reference onBack={back} />}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
