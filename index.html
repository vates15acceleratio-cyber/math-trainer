            { mat: 'Verre',            E: '70',  rho: '2500', lambda: '1,0', nu: '0,22' },
        ];

        /* ============================== ICÔNES ============================== */
        const Icon = ({ d, size = 28 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
        );
        const IconBrain = () => <Icon d={<><path d="M12 5a3 3 0 1 0-5.997.142M12 5a3 3 0 1 1 5.997.142M12 5v14M6.003 5.142A4 4 0 0 0 4 9a4 4 0 0 0 .5 6M18 5.142A4 4 0 0 1 20 9a4 4 0 0 1-.5 6M5 15a4 4 0 0 0 7 3 4 4 0 0 0 7-3"/></>} />;
        const IconBook = () => <Icon d={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>} />;
        const IconConvert = () => <Icon d={<><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>} />;
        const IconAtom = () => <Icon d={<><circle cx="12" cy="12" r="1"/><path d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z"/><path d="M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z"/></>} />;

        /* ============================== CALCUL MENTAL ============================== */
        const MentalMathGame = ({ onBack }) => {
            const [stats, setStats] = useState(() => {
                const s = localStorage.getItem('mentalMathStats');
                return s ? JSON.parse(s) : { level: 1, correct: 0, total: 0, consecutive: 0 };
            });
            const [problem, setProblem] = useState(null);
            const [userAnswer, setUserAnswer] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [timeLeft, setTimeLeft] = useState(30);
            const inputRef = useRef(null);

            useEffect(() => { generateProblem(); }, [stats.level]);
            useEffect(() => {
                if (!problem || feedback !== null) return;
                const t = setInterval(() => {
                    setTimeLeft(x => { if (x <= 1) { handleSubmit(null); return 30; } return x - 1; });
                }, 1000);
                return () => clearInterval(t);
            }, [problem, feedback]);

            const generateProblem = () => {
                const level = stats.level;
                const ops = ['+', '−', '×', '÷'];
                const operation = ops[Math.floor(Math.random() * ops.length)];
                let a, b;
                const decimal = level >= 5;

                if (operation === '+' || operation === '−') {
                    const maxNum = Math.min(10 ** Math.min(level, 4), 9999);
                    a = Math.floor(Math.random() * maxNum);
                    b = Math.floor(Math.random() * maxNum);
                    if (operation === '−' && b > a) [a, b] = [b, a];
                } else if (operation === '×') {
                    const maxNum = Math.min(10 ** Math.min(level, 2), 99);
                    a = Math.floor(Math.random() * maxNum) + 1;
                    b = Math.floor(Math.random() * maxNum) + 1;
                } else {
                    const maxNum = Math.min(10 ** Math.min(level, 2), 99);
                    b = Math.floor(Math.random() * maxNum) + 1;
                    a = b * (Math.floor(Math.random() * maxNum) + 1);
                }
                if (decimal && Math.random() > 0.5) {
                    a = Math.round(a * 10) / 10 + Math.round(Math.random() * 9) / 10;
                    a = Math.round(a * 10) / 10;
                }

                let correct;
                if (operation === '+') correct = a + b;
                else if (operation === '−') correct = a - b;
                else if (operation === '×') correct = a * b;
                else correct = a / b;
                correct = Math.round(correct * 10) / 10;

                setProblem({ a, b, operation, correct });
                setUserAnswer(''); setFeedback(null); setTimeLeft(30);
                setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
            };

            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (feedback !== null) return;
                if (!userAnswer.trim()) return;
                const isCorrect = Math.abs(parseFloat(userAnswer.replace(',', '.')) - problem.correct) < 0.05;
                const ns = {
                    ...stats,
                    total: stats.total + 1,
                    correct: stats.correct + (isCorrect ? 1 : 0),
                    consecutive: isCorrect ? stats.consecutive + 1 : 0,
                };
                if (isCorrect && ns.consecutive > 0 && ns.consecutive % 5 === 0 && stats.level < 5) ns.level = stats.level + 1;
                else if (!isCorrect && stats.consecutive === 0 && stats.level > 1 && Math.random() > 0.6) ns.level = stats.level - 1;
                setStats(ns);
                localStorage.setItem('mentalMathStats', JSON.stringify(ns));
                setFeedback(isCorrect);
                setTimeout(generateProblem, 1400);
            };

            const reset = () => {
                const ns = { level: 1, correct: 0, total: 0, consecutive: 0 };
                setStats(ns); localStorage.setItem('mentalMathStats', JSON.stringify(ns));
            };

            const levelName = ['Débutant', 'Facile', 'Moyen', 'Difficile', 'Expert'][stats.level - 1];
            const pct = stats.total ? Math.round(stats.correct / stats.total * 100) : 0;
            if (!problem) return null;

            return (
                <div className="min-h-screen p-5 flex flex-col fade-in">
                    <div className="flex items-center justify-between mb-8">
                        <button onClick={onBack} className="text-slate-400 hover:text-white">← Accueil</button>
                        <button onClick={reset} className="text-xs text-slate-500 hover:text-slate-300">Réinitialiser</button>
                    </div>
                    <div className="flex-1 flex flex-col justify-center max-w-md mx-auto w-full">
                        <div className="flex justify-between text-sm mb-1">
                            <span className="text-sky-400 font-medium">{levelName}</span>
                            <span className="text-slate-400">{pct}% • série {stats.consecutive}</span>
                        </div>
                        <div className="w-full bg-slate-800 rounded-full h-1.5 mb-10">
                            <div className="bg-sky-500 h-1.5 rounded-full transition-all" style={{ width: `${(stats.consecutive % 5) * 20}%` }} />
                        </div>

                        <div className="text-center mb-8">
                            <div className={`text-6xl font-bold tracking-tight mb-5 transition-colors ${feedback === true ? 'text-emerald-400' : feedback === false ? 'text-rose-400' : 'text-slate-100'}`}>
                                {problem.a} {problem.operation} {problem.b}
                            </div>
                            <div className={`inline-block px-3 py-1 rounded-full text-sm font-medium ${timeLeft > 10 ? 'bg-sky-500/15 text-sky-300' : 'bg-rose-500/15 text-rose-300'}`}>{timeLeft}s</div>
                        </div>

                        <div className="h-8 mb-2 text-center">
                            {feedback === true && <span className="text-emerald-400 font-semibold">Correct ✓</span>}
                            {feedback === false && <span className="text-rose-400 font-semibold">Réponse : {problem.correct}</span>}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input ref={inputRef} type="text" inputMode="decimal" value={userAnswer}
                                onChange={(e) => setUserAnswer(e.target.value)} placeholder="?"
                                disabled={feedback !== null} autoFocus
                                className="w-full px-4 py-4 text-3xl text-center bg-slate-800 text-white rounded-2xl border border-slate-700 focus:border-sky-500 focus:outline-none disabled:opacity-40" />
                            <button type="submit" disabled={feedback !== null}
                                className="w-full py-4 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 disabled:opacity-40 text-white font-semibold rounded-2xl transition">
                                Valider
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        /* ============================== FLASHCARDS ============================== */
        const FlashcardsApp = ({ onBack }) => {
            const [category, setCategory] = useState(null);
            const [order, setOrder] = useState([]);
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);

            const openCategory = (key, shuffle) => {
                const n = FORMULAS[key].length;
                let arr = Array.from({ length: n }, (_, i) => i);
                if (shuffle) arr = arr.sort(() => Math.random() - 0.5);
                setCategory(key); setOrder(arr); setIdx(0); setFlipped(false);
            };

            if (!category) {
                const groups = {};
                Object.entries(CATEGORIES).forEach(([k, v]) => {
                    (groups[v.group] = groups[v.group] || []).push(k);
                });
                return (
                    <div className="min-h-screen p-5 fade-in">
                        <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                        <h2 className="text-2xl font-bold text-white mb-1">Flashcards</h2>
                        <p className="text-slate-400 text-sm mb-6">Touche une carte pour révéler la réponse</p>
                        <div className="max-w-2xl space-y-6">
                            {Object.entries(groups).map(([g, keys]) => (
                                <div key={g}>
                                    <h3 className="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2 px-1">{g}</h3>
                                    <div className="grid gap-2">
                                        {keys.map(k => (
                                            <button key={k} onClick={() => openCategory(k, false)}
                                                className="p-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-700 text-white rounded-xl text-left transition flex justify-between items-center border border-slate-700/50">
                                                <span className="font-medium">{CATEGORIES[k].label}</span>
                                                <span className="text-xs text-slate-500">{FORMULAS[k].length}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            const cards = FORMULAS[category];
            const card = cards[order[idx]];
            return (
                <div className="min-h-screen p-5 fade-in">
                    <div className="flex items-center justify-between mb-5 max-w-2xl mx-auto">
                        <button onClick={() => setCategory(null)} className="text-slate-400 hover:text-white">← Catégories</button>
                        <button onClick={() => openCategory(category, true)} className="text-xs text-sky-400 hover:text-sky-300">Mélanger</button>
                    </div>
                    <div className="max-w-2xl mx-auto">
                        <div className="flex justify-between text-sm text-slate-400 mb-2">
                            <span className="font-medium text-slate-300">{CATEGORIES[category].label}</span>
                            <span>{idx + 1} / {cards.length}</span>
                        </div>
                        <div className="w-full bg-slate-800 rounded-full h-1.5 mb-6">
                            <div className="bg-sky-500 h-1.5 rounded-full transition-all" style={{ width: `${(idx + 1) / cards.length * 100}%` }} />
                        </div>

                        <div onClick={() => setFlipped(!flipped)}
                            className={`min-h-[18rem] rounded-2xl p-7 flex items-center justify-center cursor-pointer transition border ${flipped ? 'bg-sky-950/40 border-sky-800' : 'bg-slate-800 border-slate-700'} mb-6`}>
                            <div className="text-center">
                                <div className={`text-[10px] uppercase tracking-widest mb-4 font-semibold ${flipped ? 'text-sky-400' : 'text-slate-500'}`}>{flipped ? 'Réponse' : 'Question'}</div>
                                <div className="text-2xl sm:text-3xl font-semibold text-white leading-relaxed break-words">{flipped ? card.solution : card.formula}</div>
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button onClick={() => { setFlipped(false); setIdx(Math.max(0, idx - 1)); }} disabled={idx === 0}
                                className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white rounded-xl transition">← Préc.</button>
                            <button onClick={() => { setFlipped(false); idx < cards.length - 1 ? setIdx(idx + 1) : setCategory(null); }}
                                className="flex-1 py-3.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl transition">{idx === cards.length - 1 ? 'Terminer' : 'Suiv. →'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        /* ============================== CONVERTISSEUR ============================== */
        const Converter = ({ onBack }) => {
            const cats = Object.keys(CONVERSIONS);
            const [cat, setCat] = useState(cats[0]);
            const [value, setValue] = useState('1');
            const units = Object.keys(CONVERSIONS[cat]);
            const [from, setFrom] = useState(units[0]);

            const changeCat = (c) => { setCat(c); setFrom(Object.keys(CONVERSIONS[c])[0]); };
            const v = parseFloat(value.replace(',', '.'));
            const baseValue = isNaN(v) ? null : v * CONVERSIONS[cat][from];

            const fmt = (x) => {
                if (x === 0) return '0';
                const abs = Math.abs(x);
                if (abs < 1e-4 || abs >= 1e7) return x.toExponential(4).replace('.', ',');
                return parseFloat(x.toPrecision(7)).toString().replace('.', ',');
            };

            return (
                <div className="min-h-screen p-5 fade-in">
                    <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                    <div className="max-w-2xl mx-auto">
                        <h2 className="text-2xl font-bold text-white mb-5">Convertisseur d'unités</h2>
                        <div className="flex gap-2 overflow-x-auto pb-2 mb-5 -mx-1 px-1">
                            {cats.map(c => (
                                <button key={c} onClick={() => changeCat(c)}
                                    className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap transition ${cat === c ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                    {c.split(' (')[0]}
                                </button>
                            ))}
                        </div>

                        <div className="bg-slate-800 rounded-2xl p-4 mb-4 border border-slate-700">
                            <input type="text" inputMode="decimal" value={value} onChange={e => setValue(e.target.value)}
                                className="w-full bg-transparent text-3xl text-white focus:outline-none mb-3" />
                            <div className="flex flex-wrap gap-2">
                                {units.map(u => (
                                    <button key={u} onClick={() => setFrom(u)}
                                        className={`px-3 py-1 rounded-lg text-sm transition ${from === u ? 'bg-sky-600 text-white' : 'bg-slate-700 text-slate-300'}`}>{u}</button>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-1.5">
                            {units.filter(u => u !== from).map(u => (
                                <div key={u} className="flex justify-between items-center bg-slate-800/50 rounded-xl px-4 py-3 border border-slate-700/40">
                                    <span className="text-slate-400 text-sm">{u}</span>
                                    <span className="text-white font-mono">{baseValue === null ? '—' : fmt(baseValue / CONVERSIONS[cat][u])}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        /* ============================== CONSTANTES & MATÉRIAUX ============================== */
        const Reference = ({ onBack }) => {
            const [tab, setTab] = useState('constants');
            return (
                <div className="min-h-screen p-5 fade-in">
                    <button onClick={onBack} className="text-slate-400 hover:text-white mb-6">← Accueil</button>
                    <div className="max-w-2xl mx-auto">
                        <h2 className="text-2xl font-bold text-white mb-4">Référence</h2>
                        <div className="flex gap-2 mb-5">
                            <button onClick={() => setTab('constants')} className={`px-4 py-2 rounded-xl text-sm transition ${tab === 'constants' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Constantes physiques</button>
                            <button onClick={() => setTab('materials')} className={`px-4 py-2 rounded-xl text-sm transition ${tab === 'materials' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'}`}>Matériaux</button>
                        </div>

                        {tab === 'constants' && (
                            <div className="space-y-1.5">
                                {CONSTANTS.map((c, i) => (
                                    <div key={i} className="flex items-center justify-between bg-slate-800/50 rounded-xl px-4 py-3 border border-slate-700/40">
                                        <div>
                                            <span className="text-sky-400 font-mono font-semibold mr-2">{c.sym}</span>
                                            <span className="text-slate-400 text-sm">{c.name}</span>
                                        </div>
                                        <span className="text-white font-mono text-sm text-right">{c.val}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'materials' && (
                            <div>
                                <div className="overflow-x-auto rounded-xl border border-slate-700/40">
                                    <table className="w-full text-sm">
                                        <thead>
                                            <tr className="bg-slate-800 text-slate-400">
                                                <th className="text-left px-3 py-2.5 font-medium">Matériau</th>
                                                <th className="px-3 py-2.5 font-medium">E (GPa)</th>
                                                <th className="px-3 py-2.5 font-medium">ρ (kg/m³)</th>
                                                <th className="px-3 py-2.5 font-medium">λ (W/m·K)</th>
                                                <th className="px-3 py-2.5 font-medium">ν</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {MATERIALS.map((m, i) => (
                                                <tr key={i} className={i % 2 ? 'bg-slate-800/30' : 'bg-slate-800/60'}>
                                                    <td className="text-left px-3 py-2.5 text-white font-medium">{m.mat}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.E}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.rho}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.lambda}</td>
                                                    <td className="px-3 py-2.5 text-center text-slate-300 font-mono">{m.nu}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <p className="text-slate-500 text-xs mt-3 px-1">Valeurs indicatives de cours. Pour le dimensionnement réglementaire, se référer aux normes (Eurocodes, DTU) et à la nuance exacte du matériau.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* ============================== ACCUEIL ============================== */
        const Home = ({ go }) => {
            const tiles = [
                { id: 'mental', label: 'Calcul mental', sub: 'Progression adaptative', icon: <IconBrain />, color: 'from-sky-600 to-sky-700' },
                { id: 'flashcards', label: 'Flashcards', sub: '17 catégories de formules', icon: <IconBook />, color: 'from-indigo-600 to-indigo-700' },
                { id: 'converter', label: 'Convertisseur', sub: '11 familles d\'unités', icon: <IconConvert />, color: 'from-teal-600 to-teal-700' },
                { id: 'reference', label: 'Référence', sub: 'Constantes & matériaux', icon: <IconAtom />, color: 'from-violet-600 to-violet-700' },
            ];
            return (
                <div className="min-h-screen p-5 flex flex-col justify-center fade-in">
                    <div className="max-w-md mx-auto w-full">
                        <div className="mb-10">
                            <h1 className="text-3xl font-bold text-white tracking-tight">Math &amp; Physique</h1>
                            <p className="text-slate-400 mt-1">Entraînement et aide-mémoire pour les sciences de l'ingénieur</p>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            {tiles.map(t => (
                                <button key={t.id} onClick={() => go(t.id)}
                                    className={`aspect-square p-4 bg-gradient-to-br ${t.color} text-white rounded-2xl transition active:scale-95 flex flex-col justify-between text-left`}>
                                    <div className="opacity-90">{t.icon}</div>
                                    <div>
                                        <div className="font-bold leading-tight">{t.label}</div>
                                        <div className="text-xs opacity-75 mt-0.5">{t.sub}</div>
                                    </div>
                                </button>
                            ))}
                        </div>
                        <p className="text-slate-600 text-xs text-center mt-8">Hors ligne • aucune donnée collectée</p>
                    </div>
                </div>
            );
        };

        /* ============================== APP ============================== */
        const App = () => {
            const [view, setView] = useState('home');
            const back = () => setView('home');
            return (
                <div className="text-white">
                    {view === 'home' && <Home go={setView} />}
                    {view === 'mental' && <MentalMathGame onBack={back} />}
                    {view === 'flashcards' && <FlashcardsApp onBack={back} />}
                    {view === 'converter' && <Converter onBack={back} />}
                    {view === 'reference' && <Reference onBack={back} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
